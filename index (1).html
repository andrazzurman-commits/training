<!DOCTYPE html>
<html lang="sl">
<head>

<title>PROGRAM — VO2max Blok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0a0a0a;font-family:'SF Mono','Fira Code','JetBrains Mono','Courier New',monospace;color:#e0e0e0;-webkit-font-smoothing:antialiased;overflow-x:hidden}
input,textarea,button,select{font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:#ff3b30!important}
button{cursor:pointer}
button:active{transform:scale(.97)}

#app{max-width:480px;margin:0 auto;padding-bottom:40px;min-height:100vh}
.hdr{padding:20px 20px 14px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #1a1a1a}
.hdr h1{font-size:26px;font-weight:900;color:#fff;letter-spacing:4px;line-height:1}
.hdr .sub{margin-top:5px;font-size:11px;color:#666;letter-spacing:1px}
.wk-badge{background:#ff3b30;color:#fff;padding:5px 10px;border-radius:8px;font-size:13px;font-weight:800}

.nav{display:flex;gap:2px;padding:6px 14px;border-bottom:1px solid #1a1a1a;position:sticky;top:0;background:#0a0a0a;z-index:10}
.nav button{flex:1;padding:7px 3px;background:0;border:0;color:#666;font-size:10px;font-weight:700;letter-spacing:.5px;border-radius:7px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.2s}
.nav button.on{color:#fff;background:#1a1a1a}
.nav button i{font-style:normal;font-size:14px}

.ct{padding:14px 18px}
.sbar{padding:10px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}

.crd{padding:13px 15px;background:#111;border-radius:11px;margin-bottom:7px;border:1px solid #1a1a1a;cursor:pointer;transition:.15s}
.crd:active{transform:scale(.98)}
.crd.today{border-color:#ff3b30;background:#1a0a0a}
.crd.done{border-color:#34c75940;background:#0a1a0a}

.dl{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:800;color:#fff;letter-spacing:1px}
.tag-today{font-size:9px;font-weight:800;color:#ff3b30;letter-spacing:1px;margin-left:6px}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}

.scrd{background:#111;border-radius:11px;padding:16px;margin-bottom:10px;border:1px solid #1a1a1a}
.cbadge{background:#34c75920;color:#34c759;padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700}

.btn{width:100%;padding:11px;background:0;border:1.5px solid;border-radius:9px;font-size:13px;font-weight:700}
.btn-red{background:#ff3b30;border-color:#ff3b30;color:#fff}
.btn-ghost{border-color:#333;color:#888}

.fi{width:100%;padding:11px;background:#0a0a0a;border:1px solid #333;border-radius:7px;color:#fff;font-size:15px}
.ft{width:100%;padding:11px;background:#0a0a0a;border:1px solid #333;border-radius:7px;color:#fff;font-size:13px;min-height:60px;resize:vertical}
.fl{display:block;font-size:11px;font-weight:700;color:#888;margin-bottom:5px;letter-spacing:.5px}
.fg{margin-bottom:12px}

.mt{font-size:12px;font-weight:700;color:#fff;background:#1a1a1a;padding:3px 9px;border-radius:5px;border:1px solid #333;display:inline-block;margin:2px}
.meal-row{padding:10px 0;border-bottom:1px solid #1a1a1a}
.meal-card{background:#111;border-radius:10px;padding:14px;margin-bottom:7px;border:1px solid #1a1a1a}

.chart-box{background:#111;border-radius:11px;padding:16px;margin-bottom:10px;border:1px solid #1a1a1a}
.chart-box h4{margin:0 0 12px;font-size:12px;font-weight:700;color:#999;letter-spacing:.5px}

.sunday{display:flex;align-items:center;gap:10px;padding:14px;background:#1a1a0a;border-radius:11px;margin-bottom:10px;border:1px solid #333300}
.fishing-notice{padding:12px 14px;background:#0a1a2a;border:1px solid #007aff40;border-radius:11px;margin-bottom:14px;color:#66aaff;font-size:13px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 22px;border-radius:11px;font-size:13px;font-weight:700;border:1px solid #333;z-index:100;box-shadow:0 6px 24px rgba(0,0,0,.5);transition:opacity .3s}

.back-btn{background:0;border:0;color:#666;font-size:12px;padding:3px 0;margin-bottom:14px}

.plan-btn{flex:1;padding:9px;border:1px solid #333;border-radius:7px;font-size:12px;font-weight:700;background:#1a1a1a;color:#888;transition:.2s}
.plan-btn.on{background:#ff3b30;color:#fff;border-color:#ff3b30}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.deload-banner{padding:12px 14px;background:#1a1a0a;border:1px solid #ffcc0040;border-radius:11px;margin-bottom:10px;color:#ffcc00;font-size:13px}
.eval-banner{padding:12px 14px;background:#0a0a1a;border:1px solid #007aff40;border-radius:11px;margin-bottom:10px;color:#66aaff;font-size:13px}

<script>
// ============================================
// DATA
// ============================================
var SK = "training_program_v2";

function getVO2maxScheme(week) {
  if (week === 7) return { sets: 3, dur: 3, rest: 3, label: "DELOAD 3×3 min" };
  if (week <= 2) return { sets: 4, dur: 4, rest: 3, label: "4×4 min (3 min odmor)" };
  if (week <= 4) return { sets: 5, dur: 3, rest: 2.5, label: "5×3 min (2.5 min odmor)" };
  if (week <= 6) return { sets: 6, dur: 3, rest: 2, label: "6×3 min (2 min odmor)" };
  return { sets: 4, dur: 4, rest: 3, label: "4×4 min (3 min odmor)" };
}

function getLongRunMin(week) {
  if (week === 7) return 45;
  var mins = [60, 65, 70, 75, 80, 85, 90];
  return mins[Math.min(week - 1, 6)];
}

function getStrengthRounds(week) {
  if (week === 7) return 3;
  if (week <= 3) return 4;
  return 5;
}

function isDeload(week) { return week === 7; }
function isEval(week) { return week === 8; }

function buildWeek(week) {
  var v = getVO2maxScheme(week);
  var lr = getLongRunMin(week);
  var sr = getStrengthRounds(week);
  var dl = isDeload(week);

  return [
    {
      day: "PON", dayFull: "Ponedeljek", nType: "vo2max",
      sessions: [{
        type: "VO2max", title: "VO2max AirDyne — " + v.label, color: "#ff3b30",
        desc: v.sets + "×" + v.dur + " min ALL-OUT · HR: 163-172 bpm",
        details: [
          "Ogrevanje: 5 min lahno vrtenje",
          v.sets + " × " + v.dur + " min na RPE " + (dl ? "6-7" : "8-9") + ", max watts",
          "🔴 Target HR: 163-172 bpm",
          v.rest + " min zelo lahno vrtenje med intervali",
          "Ohlajanje: 5 min",
          "Skupaj: ~" + (v.sets * v.dur + v.sets * v.rest + 10) + " min"
        ],
        metrics: ["duration", "avgHR", "rpe", "intervals_completed", "avgWatts"]
      }]
    },
    {
      day: "TOR", dayFull: "Torek", nType: "training",
      sessions: [
        { type: "Easy", title: "Lahek aerobni tek", color: "#34c759",
          desc: (dl ? "30" : "40-50") + " min · HR: 118-136 bpm",
          details: ["Tempo: 6:30-7:00/km", "💚 Target HR: 118-136 bpm — ne preseči!", "Skupaj: " + (dl ? "30" : "40-50") + " min"],
          metrics: ["duration", "distance", "avgHR", "rpe"] },
        { type: "Strength", title: "Vzdržljivostna moč — Zgornji del", color: "#af52de",
          desc: sr + " krogi, nižja teža, višje ponovitve",
          details: [sr + " krogi, 45s odmor med vajami, 90s med krogi:", "• Sklece na TRX/obročih × 15-20", "• Pull-up (brez pasu!) × 12-15", "• Dips (brez pasu!) × 15-20", "• KB press 2×16kg × 12/roko", "• Face pulls z elastiko × 20", "• Plank 45s"],
          metrics: ["rounds", "rpe", "notes"] }
      ]
    },
    {
      day: "SRE", dayFull: "Sreda", nType: "training",
      sessions: [
        { type: "Threshold", title: dl ? "Lahek tek (deload)" : "Tempo/Threshold tek", color: "#ff9500",
          desc: dl ? "30 min lahek · HR: 118-136 bpm" : "25-35 min · HR: 145-159 bpm",
          details: dl
            ? ["30 min lahek tek @ pogovorni tempo", "💚 HR: 118-136 bpm", "Deload — brez tempa!"]
            : ["Ogrevanje: 10 min lahek tek", "20-25 min tempo @ RPE 7", "🟠 Target HR: 145-159 bpm", "Ohlajanje: 5-10 min"],
          metrics: ["duration", "distance", "avgHR", "rpe"] },
        { type: "Strength", title: "Vzdržljivostna moč — Full Body", color: "#af52de",
          desc: sr + " krogi, celotelo",
          details: [sr + " krogi, 45s odmor:", "• KB clean & press 2×16kg × 10/roko", "• Pull-up wide grip × 10-12", "• KB swing 32kg × 15", "• Sklece z dvigom × 12-15", "• Farmer carry 2×24kg × 40m", "• Turkish get-up 16kg × 3/stran"],
          metrics: ["rounds", "rpe", "notes"] }
      ]
    },
    {
      day: "ČET", dayFull: "Četrtek", nType: "training",
      sessions: [
        { type: "Easy", title: "Lahek aerobni tek", color: "#34c759",
          desc: (dl ? "30" : "40-50") + " min · HR: 118-136 bpm",
          details: ["Tempo: 6:30-7:00/km", "💚 Target HR: 118-136 bpm", "Skupaj: " + (dl ? "30" : "40-50") + " min"],
          metrics: ["duration", "distance", "avgHR", "rpe"] },
        { type: "Strength", title: "Vzdržljivostna moč — Spodnji del + Core", color: "#af52de",
          desc: sr + " krogi, nižja teža",
          details: [sr + " krogi, 45s odmor:", "• Goblet squat 24-32kg × 15-20", "• Romanian DL 60-70kg × 12-15", "• Walking lunges × 12/nogo", "• KB swing 24kg × 20", "• Step-up na klop × 10/nogo", "• Hollow body hold 30-45s"],
          metrics: ["rounds", "rpe", "notes"] }
      ]
    },
    {
      day: "PET", dayFull: "Petek", nType: "vo2max",
      sessions: [{
        type: "VO2max", title: "VO2max AirDyne — Varianta", color: "#ff3b30",
        desc: v.label + " · HR: 163-172 bpm",
        details: [
          "Trenutni protokol: " + v.label,
          v.sets + " × " + v.dur + " min @ RPE " + (dl ? "6-7" : "8-9"),
          "🔴 Target HR: 163-172 bpm",
          "Beležij watts — benchmark!",
          "Skupaj: ~" + (v.sets * v.dur + v.sets * v.rest + 10) + " min"
        ],

      }]
    },
    {
      day: "SOB", dayFull: "Sobota", nType: "training",

        type: "Long", title: "Dolgi aerobni tek", color: "#007aff",
        desc: lr + " min · HR: 118-127 bpm",
        details: ["Tempo: 6:30-7:30/km, sproščeno", "💙 Target HR: 118-127 bpm", "Fokus: čas na nogah, ne hitrost", "Hidracija!", "Skupaj: " + lr + " min"],
        metrics: ["duration", "distance", "avgHR", "rpe"]
      }]
    }
  ];
}

var NUTR = {

    { t: "10:00", n: "Malica 1", i: "30g whey + 1 banana + 15g arašidovo maslo", m: "P:30 M:9 OH:32 ~330kcal" },
    { t: "13:00", n: "Kosilo", i: "200g piščanec/puran + 200g riž/kvinoja + zelenjava + olje", m: "P:48 M:16 OH:55 ~560kcal" },
    { t: "16:00", n: "Malica 2", i: "150g grški jogurt + 30g bučna semena + 50g borovnice", m: "P:20 M:15 OH:15 ~275kcal" },
    { t: "19:30", n: "Večerja", i: "200g brancin/tuna + 150g sladki krompir + solata + olje", m: "P:45 M:14 OH:38 ~460kcal" },
    { t: "21:00", n: "Pred spanjem", i: "250g skuta + 10g bučna semena + cimet", m: "P:33 M:7 OH:5 ~215kcal" }
  ]},
  rest: { label: "Počitek dan", tag: "🟢 NIZEK OH", tc: "#34c759", kcal: 2350, p: 200, f: 90, c: 170, meals: [
    { t: "08:00", n: "Zajtrk", i: "4 jajca omleta + špinat + feta 30g + ½ avokado", m: "P:34 M:30 OH:6 ~430kcal" },
    { t: "11:00", n: "Malica 1", i: "30g whey + 200ml ovseno mleko + arašidovo maslo", m: "P:30 M:12 OH:10 ~265kcal" },
    { t: "13:30", n: "Kosilo", i: "200g piščanec + solata + olivno olje + 100g čičerika", m: "P:48 M:16 OH:28 ~450kcal" },
    { t: "16:00", n: "Malica 2", i: "150g jogurt + 20g bučna semena + 30g čokolada 85%", m: "P:17 M:17 OH:18 ~295kcal" },
    { t: "19:00", n: "Večerja", i: "200g postrv + brokolija na žaru + 150g krompir + maslo", m: "P:42 M:20 OH:30 ~470kcal" },
    { t: "21:00", n: "Pred spanjem", i: "250g skuta + cimet + 10g bučna semena", m: "P:33 M:7 OH:5 ~215kcal" }
  ]}
};

var SHOP = {
  weekly: { label: "📦 Tedenski nakup", sub: "Enkrat — traja cel teden", color: "#00bcd4", cats: [
    { cat: "🌾 OH", items: [
      ["Riž (basmati)", "600g"], ["Sladki krompir", "1 kg"], ["Krompir", "200g"], ["Ovseni kosmiči", "100g"],
      ["Polnozrnat kruh", "1 štruca"], ["Riževi vaflji", "1 pak"], ["Granola", "100g"], ["Čičerika", "1 konzerva"]
    ]},
    { cat: "🥑 Maščobe & Semena", items: [
      ["Olivno olje", "500ml"], ["Arašidovo maslo", "1 koz"], ["Bučna semena", "250g"], ["Čokolada 85%", "1 tab"]
    ]},
    { cat: "💪 Suplementi", items: [
      ["Whey protein", "250g"], ["Med", "1 koz"], ["Cimet", "1 pak"], ["Maslo", "50g"]
    ]}
  ]},
  monWed: { label: "🛒 Nakup 1: PON–SRE", sub: "Sveže za 3 dni", color: "#ff3b30", cats: [
    { cat: "🥩 Meso & Riba", items: [["Piščančja prsa", "600g"], ["Postrv fileti", "200g"], ["Brancin/tuna", "400g"]] },
    { cat: "🥚 Mlečno", items: [["Jajca", "10 kos"], ["Skuta", "750g"], ["Grški jogurt", "500g"], ["Mleko", "200ml"]] },
    { cat: "🥬 Zelenjava", items: [["Banane", "3 kos"], ["Borovnice", "200g"], ["Avokado", "2 kos"], ["Paradižniki+Solata", "2+1 pak"]] }
  ]},
  thuSun: { label: "🛒 Nakup 2: ČET–NED", sub: "Sveže za 4 dni", color: "#ff9500", cats: [
    { cat: "🥩 Meso & Riba", items: [["Piščančja prsa", "800g"], ["Postrv fileti", "400g"], ["Brancin/tuna", "400g"]] },
    { cat: "🥚 Mlečno", items: [["Jajca", "14 kos"], ["Skuta", "1 kg"], ["Grški jogurt", "650g"], ["Mleko", "200ml"], ["Ovseno mleko", "200ml"], ["Feta", "30g"]] },
    { cat: "🥬 Zelenjava", items: [["Banane", "3 kos"], ["Borovnice", "200g"], ["Avokado", "2 kos"], ["Špinat", "100g"], ["Brokolija", "300g"], ["Paradižniki+Solata", "2+2 pak"]] }
  ]}
};

var ML = {
  duration: "Trajanje (min)", distance: "Razdalja (km)", avgHR: "Povp. HR",
  rpe: "RPE (1-10)", intervals_completed: "Intervali", avgWatts: "Povp. Watts",
  rounds: "Krogi", notes: "Opombe"
};

// ============================================
// STATE
// ============================================
var S = { view: "week", selDay: null, selSess: null, form: {}, nutrForm: {}, selMeal: null };

function load() {
  try { var d = localStorage.getItem(SK); return d ? JSON.parse(d) : null; } catch(e) { return null; }
}
function save(d) {
  try { localStorage.setItem(SK, JSON.stringify(d)); } catch(e) {}
}
function getData() {
  var d = load();
  if (d && d.logs !== undefined) return d;
  var init = { week: 1, logs: [], nutritionLogs: [], fishingDays: [], bodyWeight: [{date: todayStr(), weight: 99}], tenKm: [{date: todayStr(), time: 55}] };
  save(init);
  return init;
}

function todayStr() { return new Date().toISOString().split("T")[0]; }
function todayDayIdx() { var d = new Date().getDay(); return d === 0 ? null : d - 1; } // 0=PON...5=SOB, null=NED
function todayNType() { var i = todayDayIdx(); if (i === null) return "rest"; return buildWeek(1)[i].nType; }

// ============================================
// TOAST
// ============================================
function toast(msg) {
  var el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.appendChild(el); }
  el.textContent = msg; el.style.opacity = "1";
  setTimeout(function() { el.style.opacity = "0"; }, 2200);
}

// ============================================
// RENDER
// ============================================
function h(tag, attrs, children) {
  var el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k) {
    if (k === "style" && typeof attrs[k] === "object") Object.assign(el.style, attrs[k]);
    else if (k.startsWith("on")) el[k.toLowerCase()] = attrs[k];
    else if (k === "className") el.className = attrs[k];
    else if (k === "innerHTML") el.innerHTML = attrs[k];
    else el.setAttribute(k, attrs[k]);
  });
  if (children) {
    if (!Array.isArray(children)) children = [children];
    children.forEach(function(c) {
      if (c == null) return;
      if (typeof c === "string" || typeof c === "number") el.appendChild(document.createTextNode(c));
      else el.appendChild(c);
    });
  }
  return el;
}

function render() {
  var D = getData();
  var W = buildWeek(D.week);
  var app = document.getElementById("app");
  app.innerHTML = "";

  // Header
  var hdr = h("div", {className: "hdr"}, [
    h("div", null, [
      h("h1", null, "PROGRAM"),
      h("div", {className: "sub"}, "Teden " + D.week + " · VO2max Blok · Cut" + (isDeload(D.week) ? " · DELOAD" : "") + (isEval(D.week) ? " · EVALUACIJA" : ""))
    ]),
    h("div", {className: "wk-badge"}, "T" + D.week)
  ]);
  app.appendChild(hdr);

  // Nav
  var tabs = [["week","📋","TEDEN"],["food","🥩","HRANA"],["progress","📈","NAPREDEK"],["settings","⚙️","ORODJA"]];
  var nav = h("div", {className: "nav"});
  tabs.forEach(function(t) {
    var btn = h("button", {className: S.view === t[0] ? "on" : "", onClick: function() { S.view = t[0]; S.selDay = null; S.selSess = null; S.selMeal = null; render(); }}, [
      h("i", null, t[1]), h("span", null, t[2])
    ]);
    nav.appendChild(btn);
  });
  app.appendChild(nav);

  if (S.view === "week") renderWeek(D, W);
  else if (S.view === "food") renderFood(D);
  else if (S.view === "progress") renderProgress(D);
  else if (S.view === "settings") renderSettings(D);
}

// ============================================
// WEEK VIEW
// ============================================
function logsForDay(D, dayIdx) {
  var ds = todayStr();
  return (D.logs || []).filter(function(l) { return l.date === ds && l.dayIdx === dayIdx; });
}
function dayDone(D, dayIdx, W) { return logsForDay(D, dayIdx).length >= W[dayIdx].sessions.length; }
function weekStats(D) {
  var wl = D.logs.filter(function(l) { return l.week === D.week; });
  return { total: wl.length,
    vo2max: wl.filter(function(l){return l.sType==="VO2max"}).length,
    easy: wl.filter(function(l){return l.sType==="Easy"}).length,
    threshold: wl.filter(function(l){return l.sType==="Threshold"}).length,
    strength: wl.filter(function(l){return l.sType==="Strength"}).length,
    long: wl.filter(function(l){return l.sType==="Long"}).length
  };
}

function renderWeek(D, W) {
  var ct = h("div", {className: "ct"});

var chartInstances = {};
function makeChart(id, title, data, color, type) {
  var box = h("div", {className: "chart-box"});
  box.appendChild(h("h4", null, title));
  if (data.length === 0) { box.appendChild(h("p", {style:{color:"#666",fontSize:"12px"}}, "Še ni podatkov.")); return box; }
  var wrap = h("div", {style:{position:"relative",height:"160px"}});
  var canvas = h("canvas", {id: "ch_"+id});
  wrap.appendChild(canvas);
  box.appendChild(wrap);
  setTimeout(function() {
    if (chartInstances[id]) chartInstances[id].destroy();
    chartInstances[id] = new Chart(canvas, {
      type: type, data: { labels: data.map(function(d){return d.x;}), datasets: [{ data: data.map(function(d){return d.y;}), borderColor: color, backgroundColor: color+"40", pointBackgroundColor: color, pointRadius: 3, borderWidth: 2, tension: .3, fill: type==="line" }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: {display:false} }, scales: { x: { ticks: {color:"#666",font:{size:10}}, grid:{color:"#1a1a1a"} }, y: { ticks: {color:"#666",font:{size:10}}, grid:{color:"#1a1a1a"} } } }
    });
  }, 50);
  return box;
}
function makeChartBar(id, title, labels, data, color) {
  var box = h("div", {className: "chart-box"});
  box.appendChild(h("h4", null, title));
  if (data.length === 0) { box.appendChild(h("p", {style:{color:"#666",fontSize:"12px"}}, "Še ni podatkov.")); return box; }
  var wrap = h("div", {style:{position:"relative",height:"150px"}});
  var canvas = h("canvas", {id: "ch_"+id});
  wrap.appendChild(canvas);
  box.appendChild(wrap);
  setTimeout(function() {
    if (chartInstances[id]) chartInstances[id].destroy();
    chartInstances[id] = new Chart(canvas, {
      type: "bar", data: { labels: labels, datasets: [{ data: data, backgroundColor: color, borderRadius: 4 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: {display:false} }, scales: { x: { ticks: {color:"#666",font:{size:10}}, grid:{color:"#1a1a1a"} }, y: { ticks: {color:"#666",font:{size:10}}, grid:{color:"#1a1a1a"}, beginAtZero:true } } }
    });
  }, 50);
  return box;
}

    var ds = todayStr(), ex = D.bodyWeight.findIndex(function(b){return b.date===ds;});
    if (ex>=0) D.bodyWeight[ex].weight=Number(wi.value); else D.bodyWeight.push({date:ds,weight:Number(wi.value)});
    save(D); toast("Teža zabeležena!"); wi.value=""; render();
  }}, "Shrani"));
  wc.appendChild(wr);
  ct.appendChild(wc);

  // 10km
  var tc = h("div", {className: "scrd"});
  tc.appendChild(h("h3", {style:{margin:"0 0 10px",fontSize:"14px",color:"#fff"}}, "Zabeleži 10km čas"));
  var tr = h("div", {style:{display:"flex",gap:"7px"}});
  var ti = h("input", {className: "fi", type: "number", placeholder: "minute", style:{flex:"1"}});
  tr.appendChild(ti);
  tr.appendChild(h("button", {className: "btn btn-red", style:{width:"auto",padding:"11px 18px"}, onClick: function() {
    if (!ti.value) return;
    D.tenKm = D.tenKm||[];
    D.tenKm.push({date:todayStr(),time:Number(ti.value)});
    save(D); toast("10km čas zabeležen!"); ti.value=""; render();
  }}, "Shrani"));
  tc.appendChild(tr);
  ct.appendChild(tc);

  // Program info
  var pc = h("div", {className: "scrd"});
  pc.appendChild(h("h3", {style:{margin:"0 0 10px",fontSize:"14px",color:"#fff"}}, "Program info"));
  var v = getVO2maxScheme(D.week);
  pc.appendChild(h("div", {style:{color:"#999",fontSize:"12px",lineHeight:"1.8"}, innerHTML:
    "<strong style='color:#fff'>Teden:</strong> " + D.week + " / 8<br>" +
    "<strong style='color:#fff'>Cilj:</strong> VO2max ↑, 10km 55→40 min, cut<br>" +
    "<strong style='color:#fff'>VO2max:</strong> " + v.label + "<br>" +
    "<strong style='color:#fff'>Dolgi tek:</strong> " + getLongRunMin(D.week) + " min<br>" +
    "<strong style='color:#fff'>Moč:</strong> " + getStrengthRounds(D.week) + " krogov<br>" +
    "<span style='color:#ff3b30'>●</span> 2× VO2max AirDyne<br>" +
    "<span style='color:#34c759'>●</span> 2× lahek tek<br>" +
    "<span style='color:#ff9500'>●</span> 1× tempo tek<br>" +
    "<span style='color:#af52de'>●</span> 3× vzdržljivostna moč<br>" +
    "<span style='color:#007aff'>●</span> 1× dolgi tek<br>" +
    "<div style='margin-top:8px;padding-top:8px;border-top:1px solid #1a1a1a'>" +
    "<strong style='color:#fff'>Periodizacija:</strong><br>T1-2: 4×4 · T3-4: 5×3 · T5-6: 6×3<br>T7: Deload · T8: Evaluacija v Claudu</div>" +
    "<div style='margin-top:8px;padding-top:8px;border-top:1px solid #1a1a1a'>" +
    "<strong style='color:#fff'>Prehrana (carb cycling):</strong><br>" +
    "VO2max: 2750 kcal · Trening: 2550 kcal · Počitek: 2350 kcal<br>Protein vedno: 200g</div>"
  }));
  ct.appendChild(pc);

  // HR zones
  var hrc = h("div", {className: "scrd"});
  hrc.appendChild(h("h3", {style:{margin:"0 0 10px",fontSize:"14px",color:"#fff"}}, "HR Cone (max ~181 bpm)"));
  hrc.appendChild(h("div", {style:{color:"#999",fontSize:"12px",lineHeight:"1.8"}, innerHTML:
    "<strong style='color:#34c759'>Cona 2:</strong> 118-136 bpm<br>" +
    "<strong style='color:#ff9500'>Cona 3-4:</strong> 145-159 bpm<br>" +
    "<strong style='color:#ff3b30'>Cona 5:</strong> 163-172 bpm"
  }));
  ct.appendChild(hrc);

  // Export/Import
  var exc = h("div", {className: "scrd"});
  exc.appendChild(h("h3", {style:{margin:"0 0 10px",fontSize:"14px",color:"#fff"}}, "Backup podatkov"));
  exc.appendChild(h("button", {className: "btn btn-ghost", style:{marginBottom:"7px"}, onClick: function() {
    var blob = new Blob([JSON.stringify(D, null, 2)], {type: "application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = "training-backup-" + todayStr() + ".json"; a.click();
    toast("Backup izvožen!");
  }}, "📥 Izvozi JSON backup"));
  var fileInp = h("input", {type: "file", accept: ".json", style:{display:"none"}, id: "importFile"});
  fileInp.onchange = function(e) {
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(ev) {
      try { var d = JSON.parse(ev.target.result); if(d.logs!==undefined){save(d);toast("Podatki uvoženi!");render();} else toast("Napačen format!"); }
      catch(e) { toast("Napaka pri uvozu!"); }
    };
    r.readAsText(f);
  };
  exc.appendChild(fileInp);
  exc.appendChild(h("button", {className: "btn btn-ghost", onClick: function() { document.getElementById("importFile").click(); }}, "📤 Uvozi JSON backup"));
  ct.appendChild(exc);

  // Storage info
  var sc = h("div", {className: "scrd"});
  sc.appendChild(h("h3", {style:{margin:"0 0 10px",fontSize:"14px",color:"#fff"}}, "Status"));
  sc.appendChild(h("div", {style:{fontSize:"11px",color:"#888",lineHeight:"1.8"}},
    "Storage: localStorage ✅\nLogs: " + (D.logs?D.logs.length:0) + " · Nutrition: " + (D.nutritionLogs?D.nutritionLogs.length:0) + " · Week: " + D.week
  ));
  ct.appendChild(sc);

  // Reset
  ct.appendChild(h("button", {className: "btn", style:{borderColor:"#ff3b3040",color:"#ff3b30",marginTop:"16px"}, onClick: function() {
    if (confirm("Res želiš ponastaviti VSE podatke?")) {
      localStorage.removeItem(SK);
      toast("Vse ponastavljeno!");
      render();
    }
  }}, "⚠️ Ponastavi vse podatke"));

  app.appendChild(ct);
}

// ============================================
// INIT
// ============================================
render();
</script>
</body>
</html>
